
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Graphics & AI — HOZA</title>
  <meta name="description" content="Motion Graphics and AI video projects by HOZA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0c;
      --text: #fff;
      --muted: #9999a3;
      --gap: 12px;
      --desktop-columns: 4;
      --mobile-columns: 3;
      --content-width: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
    }

    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .container {
      width: min(calc(100% - 48px), var(--content-width));
      margin: auto;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 0;
    }

    .logo {
      font: 700 clamp(30px, 4vw, 44px) "Space Grotesk", sans-serif;
      letter-spacing: -2px;
    }

    .nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }

    .nav a:hover { opacity: .6; }

    /* PAGE TITLE */
    .intro { padding: 60px 0 38px; }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
    }

    h1, h2 {
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -2px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 76px);
      line-height: 1;
      margin: 16px 0;
    }

    .intro p {
      color: var(--muted);
      font-size: 14px;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 8px;
      margin: 0 0 24px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid #38383d;
      color: #bbb;
      background: transparent;
      border-radius: 30px;
      padding: 10px 19px;
      font-size: 11px;
      font-weight: 600;
      transition: .25s;
    }

    .filter.active,
    .filter:hover {
      background: #fff;
      border-color: #fff;
      color: #111;
    }

    /* REELS GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(var(--desktop-columns), minmax(0, 1fr));
      gap: var(--gap);
    }

    .tile {
      min-width: 0;
      display: block;
      padding: 0;
      border: 0;
      text-align: left;
      color: white;
      background: transparent;
    }

    .thumb {
      position: relative;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 9px;
      background: linear-gradient(145deg, #30333c, #17181e);
      isolation: isolate;
    }

    .thumb video,
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }

    .thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 65%, rgba(0,0,0,.45));
      pointer-events: none;
    }

    .tile:hover .thumb video,
    .tile:hover .thumb img {
      transform: scale(1.03);
    }

    .play-mark {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 26px;
      text-shadow: 0 2px 12px #0009;
      pointer-events: none;
    }

    .tile-title {
      font-weight: 600;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.4;
    }

    .tile-type {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    .placeholder {
      display: grid;
      place-items: center;
      color: #777984;
      font-size: 10px;
      letter-spacing: 1px;
      border: 1px solid #292a31;
    }

    .empty-message {
      grid-column: 1 / -1;
      color: var(--muted);
      padding: 50px 0;
    }

    footer {
      margin-top: 110px;
      padding: 30px 0;
      border-top: 1px solid #26262b;
      display: flex;
      justify-content: space-between;
      color: #777780;
      font-size: 11px;
    }

    /* REELS VIEWER */
    .viewer[hidden] { display: none; }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #09090b;
      display: flex;
      flex-direction: column;
      padding: 18px 28px;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-header .logo { font-size: 27px; }

    .icon-btn {
      border: 1px solid #414149;
      background: #222228;
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .icon-btn:hover { background: #414149; }

    .viewer-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex: 1;
      min-height: 0;
    }

    .viewer-info {
      width: 210px;
      flex-shrink: 0;
    }

    .viewer-info h2 {
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -1px;
      margin: 12px 0;
    }

    .viewer-info p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .screen {
      position: relative;
      aspect-ratio: 9 / 16;
      width: min(360px, calc((100dvh - 125px) * .5625));
      max-height: calc(100dvh - 125px);
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 1;
      touch-action: pan-x;
    }

    .screen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
      cursor: pointer;
    }

    .screen-shade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, #000a);
      padding: 45px 16px 12px;
      pointer-events: none;
    }

    .mobile-info { display: none; }

    .player-controls {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-controls button {
      background: #0009;
      color: white;
      border: 0;
      padding: 7px 9px;
      border-radius: 5px;
      font-size: 12px;
    }

    .seek {
      flex: 1;
      min-width: 0;
      accent-color: white;
      cursor: pointer;
    }

    .status {
      position: absolute;
      top: 20px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: 11px;
      color: #ddd;
      pointer-events: none;
    }

    .viewer-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .counter {
      color: #aaa;
      font-size: 11px;
      white-space: nowrap;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .container {
        width: calc(100% - 32px);
      }

      .header { padding: 22px 0; }
      .logo { font-size: 34px; }
      .nav { gap: 16px; font-size: 10px; }

      .intro { padding: 40px 0 25px; }
      .intro p { font-size: 12px; }

      .gallery {
        grid-template-columns: repeat(var(--mobile-columns), minmax(0, 1fr));
        gap: 8px;
      }

      .thumb { border-radius: 5px; }
      .tile-title, .tile-type { display: none; }
      .play-mark { font-size: 18px; }

      .filters { margin-bottom: 18px; }
      .filter { padding: 9px 12px; font-size: 10px; }

      .viewer { padding: 12px; }
      .viewer-header .logo { font-size: 25px; }

      .viewer-layout {
        flex-direction: column;
        gap: 12px;
        padding: 10px 0;
      }

      .viewer-info { display: none; }

      .screen {
        width: min(100%, calc((100dvh - 180px) * .5625));
        max-height: calc(100dvh - 180px);
      }

      .mobile-info {
        display: block;
        padding-bottom: 32px;
        font-size: 13px;
        font-weight: 600;
      }

      .mobile-info small {
        color: #ddd;
        display: block;
        font-size: 10px;
        margin-top: 4px;
      }

      .viewer-nav { flex-direction: row; }
      .viewer-nav .icon-btn { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
/* Hide play icon on mobile only */
@media (max-width: 700px) {
  .play-mark {
    display: none;
  }
}

/* HOZA - Mobile Fullscreen Reels Viewer */
@media (max-width: 700px) {

  /* Full mobile screen */
  .viewer {
    padding: 0;
    height: 100dvh;
  }

  /* Header over video */
  .viewer-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 16px;
    pointer-events: none;
  }

  .viewer-header #close {
  pointer-events: auto;
  margin-left: auto;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  width: auto !important;
  height: auto !important;
  padding: 0 !important;
  box-shadow: none !important;
  color: #fff;
  font-size: 42px;
  line-height: 1;
}

  /* Fullscreen player layout */
  .viewer-layout {
    display: block;
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    padding: 0;
  }

  .screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    aspect-ratio: auto;
    border-radius: 0;
    touch-action: pan-x;
  }

  /* Display full video without cropping */
  .screen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Hide playback controls */
  .player-controls {
    display: none !important;
  }

  /* Hide arrows and video counter */
  .viewer-nav {
    display: none !important;
  }

  /* Project title overlay */
  .screen-shade {
    padding: 45px 18px 35px;
  }

  .mobile-info {
    padding-bottom: 0;
  }
}

/* Hide sound control on all devices */
#sound-btn {
  display: none !important;
}

  </style>
</head>

<body>

  <div class="container">
    <header class="header">
      <a href="index.html" class="logo">HOZA.</a>
      <nav class="nav">
        <a href="index.html">HOME</a>
        <a href="index.html#about">ABOUT</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <div class="eyebrow">01 / SELECTED WORK</div>
        <h1>MOTION GRAPHICS<br>& AI</h1>
        <p>A collection of visual stories in motion.</p>
      </section>

      <div class="filters" aria-label="Project filters">
        <button class="filter active" data-filter="all" aria-pressed="true">ALL WORK</button>
        <button class="filter" data-filter="motion" aria-pressed="false">MOTION GRAPHICS</button>
        <button class="filter" data-filter="ai" aria-pressed="false">AI VIDEOS</button>
      </div>

      <section class="gallery" id="gallery" aria-label="Video projects"></section>
    </main>

    <footer>
      <span>© HOZA — CREATIVE PORTFOLIO</span>
      <a href="index.html">BACK TO HOME ↗</a>
    </footer>
  </div>

  <!-- FULLSCREEN REELS VIEWER -->
  <div class="viewer" id="viewer" role="dialog"
       aria-modal="true" aria-label="Video viewer" hidden>

    <div class="viewer-header">
      <span class="logo">HOZA.</span>
      <button class="icon-btn" id="close" aria-label="Close viewer">×</button>
    </div>

    <div class="viewer-layout">
      <aside class="viewer-info">
        <span class="eyebrow">SELECTED PROJECT</span>
        <h2 id="viewer-title"></h2>
        <p id="viewer-category"></p>
        <p id="viewer-description"></p>
      </aside>

      <div class="screen" id="screen">
<video id="player" playsinline loop preload="metadata"></video>
        <div class="status" id="status"></div>

        <div class="screen-shade">
          <div class="mobile-info">
            <span id="mobile-title"></span>
            <small id="mobile-category"></small>
          </div>
        </div>

        <div class="player-controls">
          <button id="play-btn" aria-label="Pause video">Ⅱ</button>
          <input class="seek" id="seek" type="range"
                 min="0" max="100" value="0"
                 aria-label="Video progress">
          <button id="sound-btn" aria-label="Unmute">MUTE</button>
        </div>
      </div>

      <div class="viewer-nav">
        <button class="icon-btn" id="prev" aria-label="Previous video">↑</button>
        <span class="counter" id="counter">1 / 1</span>
        <button class="icon-btn" id="next" aria-label="Next video">↓</button>
      </div>
    </div>
  </div>

  <script>
    /*
      PROJECT LIBRARY
      Add real projects here later.
      Each new project automatically appears in the grid.
    */
    
const projects = [
  {
    title: "SHADE — Bluemoon",
    category: "ai",
    video: "videos/shade-bluemoon.mp4",
    poster: "videos/shade-bluemoon.jpg",
    description: "SHADE Perfumes — Bluemoon AI Commercial."
  },
  {
    title: "Motion / AI Mini Showreel",
    category: "motion",
    video: "videos/motion.mp4",
    poster: "",
    description: "A selection of motion graphics and creative video work."
  }
];

    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("viewer");
    const player = document.getElementById("player");
    const seek = document.getElementById("seek");
    const status = document.getElementById("status");

    let currentIndex = 0;
    let currentFilter = "all";
let isMuted = false;
    let lastFocused = null;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    // CREATE GALLERY
    function renderGallery() {
      const available = projects
        .map((project, index) => ({ ...project, index }))
        .filter(project =>
          currentFilter === "all" ||
          project.category === currentFilter
        );

      gallery.innerHTML = "";

      available.forEach(project => {
        const tile = document.createElement("button");
        tile.className = "tile";
        tile.setAttribute("aria-label", "Watch " + project.title);

        const thumb = document.createElement("div");
        thumb.className = "thumb";

        if (project.poster) {
          const img = document.createElement("img");
          img.src = project.poster;
          img.alt = "";
          img.loading = "lazy";
          thumb.appendChild(img);
        } else {
          const preview = document.createElement("video");
          preview.src = project.video + "#t=0.2";
          preview.muted = true;
          preview.playsInline = true;
          preview.preload = "metadata";
          preview.setAttribute("aria-hidden", "true");
          thumb.appendChild(preview);
        }

        const playIcon = document.createElement("span");
        playIcon.className = "play-mark";
        playIcon.textContent = "▶";
        thumb.appendChild(playIcon);

        const title = document.createElement("div");
        title.className = "tile-title";
        title.textContent = project.title;

        const type = document.createElement("div");
        type.className = "tile-type";
        type.textContent = project.category === "ai"
          ? "AI VIDEO"
          : "MOTION GRAPHICS";

        tile.append(thumb, title, type);
        tile.addEventListener("click", () => openViewer(project.index));
        gallery.appendChild(tile);
      });

      // Temporary empty slots to preview the 4/3-column layout.
      if (currentFilter === "all") {
        const remaining = Math.max(0, 8 - available.length);
        for (let i = 0; i < remaining; i++) {
          const slot = document.createElement("div");
          slot.className = "tile";
          slot.innerHTML =
            '<div class="thumb placeholder">COMING SOON</div>';
          gallery.appendChild(slot);
        }
      } else if (available.length === 0) {
        gallery.innerHTML =
          '<p class="empty-message">Projects coming soon.</p>';
      }
    }

    // FILTER BUTTONS
    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll(".filter").forEach(btn => {
          const active = btn === button;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", String(active));
        });

        renderGallery();
      });
    });

    function loadProject() {
      const project = projects[currentIndex];

      player.pause();
      player.src = project.video;
      player.muted = isMuted;
      player.loop = true;
      player.load();

      document.getElementById("viewer-title").textContent =
        project.title;

      document.getElementById("viewer-category").textContent =
        project.category === "ai" ? "AI VIDEO" : "MOTION GRAPHICS";

      document.getElementById("viewer-description").textContent =
        project.description || "";

      document.getElementById("mobile-title").textContent =
        project.title;

      document.getElementById("mobile-category").textContent =
        project.category === "ai" ? "AI VIDEO" : "MOTION GRAPHICS";

      document.getElementById("counter").textContent =
        `${currentIndex + 1} / ${projects.length}`;

      seek.value = 0;
      status.textContent = "";

      document.getElementById("sound-btn").textContent =
        isMuted ? "MUTE" : "SOUND";

      if (!reducedMotion) {
        player.play().catch(() => {
          status.textContent = "Tap the video to play";
        });
      }

      updatePlayButton();
    }

    // OPEN / CLOSE
    function openViewer(index) {
      lastFocused = document.activeElement;
      currentIndex = index;
      viewer.hidden = false;
      document.body.style.overflow = "hidden";
      loadProject();
      document.getElementById("close").focus();
    }

    function closeViewer() {
      player.pause();
      player.removeAttribute("src");
      player.load();
      viewer.hidden = true;
      document.body.style.overflow = "";

      if (lastFocused && lastFocused.isConnected) {
        lastFocused.focus();
      }
    }

    function nextVideo() {
      currentIndex = (currentIndex + 1) % projects.length;
      loadProject();
    }

    function previousVideo() {
      currentIndex =
        (currentIndex - 1 + projects.length) % projects.length;
      loadProject();
    }

    // PLAY / PAUSE
    function updatePlayButton() {
      const button = document.getElementById("play-btn");
      button.textContent = player.paused ? "▶" : "Ⅱ";
      button.setAttribute(
        "aria-label",
        player.paused ? "Play video" : "Pause video"
      );
    }

    function togglePlay() {
      if (player.paused) {
        player.play().catch(() => {});
      } else {
        player.pause();
      }
      updatePlayButton();
    }

    document.getElementById("close").onclick = closeViewer;
    document.getElementById("next").onclick = nextVideo;
    document.getElementById("prev").onclick = previousVideo;
    document.getElementById("play-btn").onclick = togglePlay;
    player.addEventListener("click", togglePlay);
    player.addEventListener("play", updatePlayButton);
    player.addEventListener("pause", updatePlayButton);

    document.getElementById("sound-btn").onclick = () => {
      isMuted = !isMuted;
      player.muted = isMuted;
      document.getElementById("sound-btn").textContent =
        isMuted ? "MUTE" : "SOUND";
    };

    // VIDEO PROGRESS
    player.addEventListener("timeupdate", () => {
      if (Number.isFinite(player.duration) && player.duration > 0) {
        seek.value = (player.currentTime / player.duration) * 100;
      }
    });

    seek.addEventListener("input", () => {
      if (Number.isFinite(player.duration) && player.duration > 0) {
        player.currentTime =
          (Number(seek.value) / 100) * player.duration;
      }
    });

    player.addEventListener("error", () => {
      status.textContent = "Video unavailable";
    });

    // KEYBOARD NAVIGATION
    document.addEventListener("keydown", event => {
      if (viewer.hidden) return;

      if (event.key === "Escape") {
        closeViewer();
      } else if (
        ["ArrowDown", "ArrowRight"].includes(event.key)
      ) {
        event.preventDefault();
        nextVideo();
      } else if (
        ["ArrowUp", "ArrowLeft"].includes(event.key)
      ) {
        event.preventDefault();
        previousVideo();
      } else if (
        event.code === "Space" &&
        event.target !== seek
      ) {
        event.preventDefault();
        togglePlay();
      }
    });

    // MOBILE SWIPE NAVIGATION
    const screen = document.getElementById("screen");
    let touchStartY = 0;

    screen.addEventListener("touchstart", event => {
      touchStartY = event.changedTouches[0].clientY;
    }, { passive: true });

    screen.addEventListener("touchend", event => {
      const distance =
        touchStartY - event.changedTouches[0].clientY;

      if (Math.abs(distance) > 50) {
        if (distance > 0) nextVideo();
        else previousVideo();
      }
    }, { passive: true });

    // DESKTOP SCROLL NAVIGATION
    let lastScroll = 0;

    viewer.addEventListener("wheel", event => {
      if (viewer.hidden || Math.abs(event.deltaY) < 20) return;

      event.preventDefault();

      if (Date.now() - lastScroll < 650) return;
      lastScroll = Date.now();

      if (event.deltaY > 0) nextVideo();
      else previousVideo();
    }, { passive: false });

    renderGallery();
  </script>

</body>
</html>
