<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HV STORE — 3D animation project by HOZA.">
  <title>HV STORE — HOZA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .back {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: right;
    }
    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }
    .label {
      display: inline-block;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }
    h1 {
      margin: 12px 0;
      font-size: clamp(48px, 9vw, 110px);
      line-height: 1.06;
      letter-spacing: -4px;
    }
    .hv-store-content {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 80px;
    }
    .hv-store-cover {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .hv-store-dog {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
    }
    .hv-store-dog img {
      display: block;
      width: min(460px, 80%);
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
    .hv-store-video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      .logo { font-size: 29px; }
      .intro { padding: 0 16px; margin: 35px auto 25px; }
      h1 { letter-spacing: -2px; }
      .hv-store-cover, .hv-store-video { border-radius: 5px; }
      .hv-store-dog { padding: 6px 0; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">&larr; BACK TO ANIMATION</a>
  </header>
  <main>
    <div class="intro">
      <span class="label">02 / ANIMATION PROJECT</span>
      <h1>HV STORE</h1>
      <span class="label">3D ANIMATION PROJECT</span>
    </div>
    <section class="hv-store-content" aria-label="HV Store animation and artwork">
      <!-- 01: Intro artwork -->
      <img class="hv-store-cover"
           src="images/hv-store/hv-store-cover.jpg"
           alt="HV STORE — storefront concept with Syko"
           decoding="async">
      <!-- 02: Transparent character artwork -->
      <div class="hv-store-dog">
        <img src="images/hv-store/hv-store-dog.png"
             alt="Syko — character illustration"
             loading="lazy"
             decoding="async">
      </div>
      <!-- 03: Animation film -->
      <video class="hv-store-video" controls playsinline preload="metadata">
        <source src="videos/hv-store-01.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </section>
  </main>
</body>
</html>
