<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Runaway Ride — stylized short animation by HOZA.">
  <title>RUNAWAY RIDE — HOZA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo { font-size: 34px; font-weight: 900; letter-spacing: -2px; }
    .back { font-size: 11px; font-weight: bold; letter-spacing: 1px; text-align: right; }
    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }
    .label {
      display: inline-block;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }
    h1 {
      margin: 12px 0;
      font-size: clamp(44px, 9vw, 110px);
      line-height: 1.06;
      letter-spacing: -4px;
    }
    .film {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 12px;
      background: #000;
    }
    .film video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      .logo { font-size: 29px; }
      .intro { padding: 0 16px; margin: 35px auto 25px; }
      h1 { letter-spacing: -2px; }
      .film { margin-bottom: 12px; }
    }

    /* Three vertical clips: same combined width as the main film */
    .runaway-clips {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .runaway-clips video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      height: auto;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .runaway-clips { gap: 6px; margin-bottom: 30px; }
      .runaway-clips video { border-radius: 5px; }
    }

    /* Runaway Ride: one Behind the Scenes video, matching main film width */
    .runaway-bts {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 70px;
    }
    .runaway-bts h2 {
      margin: 0 0 22px;
      text-align: center;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: 2px;
    }
    .runaway-bts video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    @media (max-width: 600px) {
      .runaway-bts h2 { margin-bottom: 14px; letter-spacing: 1px; }
      .runaway-bts { margin-bottom: 50px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">&larr; BACK TO ANIMATION</a>
  </header>
  <main>
    <div class="intro">
      <span class="label">04 / ANIMATION PROJECT</span>
      <h1>RUNAWAY RIDE</h1>
      <span class="label">STYLIZED SHORT ANIMATION</span>
    </div>
    <section class="film" aria-label="Runaway Ride main film">
      <video controls playsinline preload="metadata" poster="videos/runaway-ride-cover.jpg">
        <source src="videos/runaway-ride.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </section>

    <!-- Three vertical clips immediately below the main film -->
    <section class="runaway-clips" aria-label="Runaway Ride animation clips">
      <video controls playsinline preload="none" poster="videos/runaway-sfx.jpg">
        <source src="videos/runaway-sfx.mp4" type="video/mp4">
      </video>
      <video controls playsinline preload="none" poster="videos/runaway-pixels.jpg">
        <source src="videos/runaway-pixels.mp4" type="video/mp4">
      </video>
      <video controls playsinline preload="none" poster="videos/runaway-comics.jpg">
        <source src="videos/runaway-comics.mp4" type="video/mp4">
      </video>
    </section>


    <!-- Only one Behind the Scenes video -->
    <section class="runaway-bts" aria-label="Runaway Ride Behind the Scenes">
      <h2>BEHIND THE SCENES</h2>
      <video controls playsinline preload="none" poster="videos/runaway-bts.jpg">
        <source src="videos/runaway-bts.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </section>
  </main>
</body>
</html>
