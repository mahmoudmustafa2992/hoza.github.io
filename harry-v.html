
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARRY V — HOZA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #09090b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .back {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }

    .label {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(48px, 9vw, 110px);
      letter-spacing: -4px;
    }

    
.film {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto;
  background: #000;
}

    .film video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    .section {
      max-width: 1180px;
      margin: 80px auto;
      padding: 0 24px;
    }

    h2 {
      font-size: clamp(38px, 7vw, 76px);
      letter-spacing: -3px;
      margin: 15px 0 30px;
    }

    .placeholder {
      padding: 100px 24px;
      background: #151517;
      border: 1px solid #333;
      text-align: center;
      color: #aaa;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      .logo { font-size: 29px; }
      .intro { padding: 0 16px; margin: 35px auto 25px; }
      h1 { letter-spacing: -2px; }
      .section { padding: 0 16px; margin: 55px auto; }
      .placeholder { padding: 65px 16px; }
    }
    
/* HARRY V — THREE VERTICAL VIDEOS */

.vertical-videos {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 20px auto 75px;

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.vertical-videos video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
  border-radius: 4px;
}

@media (max-width: 600px) {
  .vertical-videos {
    gap: 6px;
    margin: 14px auto 50px;
  }

  .vertical-videos video {
    border-radius: 2px;
  }
}

/* HARRY V — BEHIND THE SCENES TITLE */

.behind-scenes {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto 90px;
  padding: 80px 0 100px;
  text-align: center;
}

.behind-scenes h2 {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  font-size: clamp(20px, 2.2vw, 32px);
  font-weight: 600;
  letter-spacing: 0.12em;
  line-height: 1.3;
  color: #ffffff;
}

@media (max-width: 600px) {
  .behind-scenes {
    padding: 55px 0 75px;
  }

  .behind-scenes h2 {
    font-size: 18px;
    letter-spacing: 0.09em;
  }
}

/* HARRY V — ENVIRONMENT VIEWER — FINAL DESIGN */

.behind-scenes {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 0 18px;
  text-align: center;
}

.behind-scenes h2 {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.4;
  color: #fff;
}

/* Centered image, smaller than the main film */
.materials-gallery {
  display: block;
  width: calc(100% - 32px);
  max-width: 850px;
  margin: 0 auto 90px;
}

/* Image container */
.materials-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 5px;
  background: #000;
}

/* Fixed background */
.materials-environment {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Future items appear here */
.materials-item-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* Thin arrows over the image */
.materials-arrow {
  position: absolute;
  top: 53%;
  transform: translateY(-50%);
  z-index: 3;

  width: 42px;
  height: 62px;
  padding: 0;
  border: 0;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.materials-arrow.prev {
  left: 12px;
}

.materials-arrow.next {
  right: 12px;
}

.materials-arrow svg {
  width: 25px;
  height: 34px;
  fill: none;
  stroke: white;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.materials-arrow:disabled {
  opacity: 1;
  cursor: default;
}

/* Mobile */
@media (max-width: 600px) {
  .behind-scenes {
    padding: 35px 0 18px;
  }

  .behind-scenes h2 {
    font-size: 19px;
  }

  .materials-gallery {
    width: calc(100% - 24px);
    margin-bottom: 60px;
  }

  .materials-arrow {
    width: 30px;
    height: 48px;
  }

  .materials-arrow.prev {
    left: 4px;
  }

  .materials-arrow.next {
    right: 4px;
  }

  .materials-arrow svg {
    width: 19px;
    height: 28px;
  }
}

  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">
      ← BACK TO ANIMATION
    </a>
  </header>

  <main>

    <div class="intro">
      <span class="label">01 / ANIMATION PROJECT</span>
      <h1>HARRY V</h1>
      <span class="label">MAIN FILM</span>
    </div>

    <!-- MAIN ANIMATION FILM -->

    <section class="film">
      <video
        controls
        playsinline
        preload="metadata"
        poster="videos/harry-v-cover.jpg">

        <source
          src="videos/harry-v-animation-web.mp4"
          type="video/mp4">

      </video>
    </section>

<!-- HARRY V — THREE VERTICAL VIDEOS -->

<section class="vertical-videos">

  <!-- VIDEO 01 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-01.jpg">
    <source
      src="videos/harry-v-vertical-01.mp4"
      type="video/mp4">
  </video>

  <!-- VIDEO 02 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-02.jpg">
    <source
      src="videos/harry-v-vertical-02.mp4"
      type="video/mp4">
  </video>

  <!-- VIDEO 03 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-03.jpg">
    <source
      src="videos/harry-v-vertical-03.mp4"
      type="video/mp4">
  </video>

</section>

    <!-- MAKING OF -->

    
<!-- BEHIND THE SCENES -->

<section class="behind-scenes">
  <h2>BEHIND THE SCENES</h2>
</section>

<!-- HARRY V — ENVIRONMENT VIEWER -->

<section class="materials-gallery">

  <div class="materials-scene">

    <!-- FIXED BACKGROUND -->
    <img
      class="materials-environment"
      src="videos/harry-v-environment.jpg"
      alt="HARRY V Environment">

    <!-- ITEMS WILL APPEAR HERE -->
    <div
      class="materials-item-layer"
      id="materials-item-layer">
    </div>

    <!-- LEFT THIN ARROW -->
    <button
      class="materials-arrow prev"
      id="materials-prev"
      type="button"
      aria-label="Previous item"
      disabled>

      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M20 5 L9 16 L20 27"/>
      </svg>

    </button>

    <!-- RIGHT THIN ARROW -->
    <button
      class="materials-arrow next"
      id="materials-next"
      type="button"
      aria-label="Next item"
      disabled>

      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M12 5 L23 16 L12 27"/>
      </svg>

    </button>

  </div>

</section>

  </main>

</body>
</html>
