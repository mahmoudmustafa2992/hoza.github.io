
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARRY V — HOZA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #09090b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .back {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }

    .label {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(48px, 9vw, 110px);
      letter-spacing: -4px;
    }

    
.film {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto;
  background: #000;
}

    .film video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    .section {
      max-width: 1180px;
      margin: 80px auto;
      padding: 0 24px;
    }

    h2 {
      font-size: clamp(38px, 7vw, 76px);
      letter-spacing: -3px;
      margin: 15px 0 30px;
    }

    .placeholder {
      padding: 100px 24px;
      background: #151517;
      border: 1px solid #333;
      text-align: center;
      color: #aaa;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      .logo { font-size: 29px; }
      .intro { padding: 0 16px; margin: 35px auto 25px; }
      h1 { letter-spacing: -2px; }
      .section { padding: 0 16px; margin: 55px auto; }
      .placeholder { padding: 65px 16px; }
    }
    
/* HARRY V — THREE VERTICAL VIDEOS */

.vertical-videos {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 20px auto 75px;

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.vertical-videos video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
  border-radius: 4px;
}

@media (max-width: 600px) {
  .vertical-videos {
    gap: 6px;
    margin: 14px auto 50px;
  }

  .vertical-videos video {
    border-radius: 2px;
  }
}

/* HARRY V — BEHIND THE SCENES TITLE */

.behind-scenes {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto 90px;
  padding: 80px 0 100px;
  text-align: center;
}

.behind-scenes h2 {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  font-size: clamp(20px, 2.2vw, 32px);
  font-weight: 600;
  letter-spacing: 0.12em;
  line-height: 1.3;
  color: #ffffff;
}

@media (max-width: 600px) {
  .behind-scenes {
    padding: 55px 0 75px;
  }

  .behind-scenes h2 {
    font-size: 18px;
    letter-spacing: 0.09em;
  }
}

  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">
      ← BACK TO ANIMATION
    </a>
  </header>

  <main>

    <div class="intro">
      <span class="label">01 / ANIMATION PROJECT</span>
      <h1>HARRY V</h1>
      <span class="label">MAIN FILM</span>
    </div>

    <!-- MAIN ANIMATION FILM -->

    <section class="film">
      <video
        controls
        playsinline
        preload="metadata"
        poster="videos/harry-v-cover.jpg">

        <source
          src="videos/harry-v-animation-web.mp4"
          type="video/mp4">

      </video>
    </section>

<!-- HARRY V — THREE VERTICAL VIDEOS -->

<section class="vertical-videos">

  <!-- VIDEO 01 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-01.jpg">
    <source
      src="videos/harry-v-vertical-01.mp4"
      type="video/mp4">
  </video>

  <!-- VIDEO 02 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-02.jpg">
    <source
      src="videos/harry-v-vertical-02.mp4"
      type="video/mp4">
  </video>

  <!-- VIDEO 03 -->
  <video
    controls
    playsinline
    preload="none"
    poster="videos/harry-v-vertical-03.jpg">
    <source
      src="videos/harry-v-vertical-03.mp4"
      type="video/mp4">
  </video>

</section>

    <!-- MAKING OF -->

    
<!-- BEHIND THE SCENES -->

<section class="behind-scenes">
  <h2>BEHIND THE SCENES</h2>
</section>

  </main>

</body>
</html>
