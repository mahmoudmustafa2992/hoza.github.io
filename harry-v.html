/* HARRY V — ENVIRONMENT VIEWER — FINAL DESIGN */

.behind-scenes {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 0 18px;
  text-align: center;
}

.behind-scenes h2 {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.4;
  color: #fff;
}

/* Centered image, smaller than the main film */
.materials-gallery {
  display: block;
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto 90px;
}

/* Image container */
.materials-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 5px;
  background: #000;
}

/* Fixed background */
.materials-environment {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Future items appear here */
.materials-item-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* Thin arrows over the image */
.materials-arrow {
  position: absolute;
  top: 53%;
  transform: translateY(-50%);
  z-index: 3;

  width: 42px;
  height: 62px;
  padding: 0;
  border: 0;
  background: transparent;

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.materials-arrow.prev {
  left: 12px;
}

.materials-arrow.next {
  right: 12px;
}

.materials-arrow svg {
  width: 25px;
  height: 34px;
  fill: none;
  stroke: white;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.materials-arrow:disabled {
  opacity: 1;
  cursor: default;
}

/* Mobile */
@media (max-width: 600px) {
  .behind-scenes {
    padding: 35px 0 18px;
  }

  .behind-scenes h2 {
    font-size: 19px;
  }

  .materials-gallery {
  width: calc(100% - 32px);
  margin-bottom: 60px;
}

  .materials-arrow {
    width: 30px;
    height: 48px;
  }

  .materials-arrow.prev {
    left: 4px;
  }

  .materials-arrow.next {
    right: 4px;
  }

  .materials-arrow svg {
    width: 19px;
    height: 28px;
  }
}

/* HARRY V — MATERIALS ITEM OVERLAY */

#materials-item-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

#materials-item-layer img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 1;
  transition: opacity 0.22s ease;
}

/* HARRY V — STORYBOARD IMAGES */

.storyboards-row {
  width: calc(100% - 32px);

  gap: 12px;
}

.storyboards-row img {

  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 4px;
}

  }

/* HARRY V — SIX CONCEPT SKETCHES */

}

.concept-sketches img {

}

/* MOBILE */

  margin-bottom: 16px;

  margin-top: 0;
  margin-bottom: 16px;
}

/* Six Concept Sketches */

  margin-top: 0;
  margin-bottom: 50px;
}

/* HARRY V — FINAL SKETCH COMPOSITION */

/* Keep spacing consistent with previous images */
.concept-sketches {
  margin-bottom: 16px;
}

/* Two landscape images + one portrait */
.sketch-composition {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 0 auto 70px;

  display: grid;
  grid-template-columns: 52fr 48fr;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 12px;

  aspect-ratio: 22 / 13;
}

.sketch-composition img {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: contain;
  background: #fff;
  border-radius: 3px;
}

/* Top-left landscape */
.sketch-top {
  grid-column: 1;
  grid-row: 1;
}

/* Bottom-left landscape */
.sketch-bottom {
  grid-column: 1;
  grid-row: 2;
}

/* Right-side portrait, spanning both rows */
.sketch-portrait {
  grid-column: 2;
  grid-row: 1 / 3;
}

/* Mobile — keep the same composition */
@media (max-width: 600px) {

    gap: 6px;

<!-- HARRY V — MATERIALS SLIDER -->

<script>
document.addEventListener("DOMContentLoaded", function () {

  const layer = document.getElementById("materials-item-layer");
  const prev = document.getElementById("materials-prev");
  const next = document.getElementById("materials-next");

  if (!layer || !prev || !next) return;

  // ALL 16 PNG MATERIALS
  const items = Array.from({ length: 16 }, (_, i) => {
    const number = String(i + 1).padStart(2, "0");
    return "images/harry-v/materials/item-" + number + ".png";
  });

  let currentIndex = 0;
  let changing = false;

  // SHOW FIRST ITEM
  const itemImage = document.createElement("img");

  itemImage.src = items[0];
  itemImage.alt = "HARRY V — Item 01";

  layer.replaceChildren(itemImage);

  // ENABLE ARROWS
  prev.disabled = false;
  next.disabled = false;

  function changeItem(direction) {

    if (changing) return;

    changing = true;

    const newIndex =
      (currentIndex + direction + items.length) % items.length;

    // LOAD NEXT IMAGE FIRST
    const preload = new Image();

    preload.onload = function () {

      // FADE OUT
      itemImage.style.opacity = "0";

      setTimeout(function () {

        itemImage.src = items[newIndex];

        itemImage.alt =
          "HARRY V — Item " +
          String(newIndex + 1).padStart(2, "0");

        currentIndex = newIndex;

        // FADE IN
        requestAnimationFrame(function () {
          itemImage.style.opacity = "1";
          changing = false;
        });

      }, 220);
    };

    preload.onerror = function () {
      changing = false;
      console.error("Image not found:", items[newIndex]);
    };

    preload.src = items[newIndex];
  }

  // LEFT ARROW
  prev.addEventListener("click", function () {
    changeItem(-1);
  });

  // RIGHT ARROW
  next.addEventListener("click", function () {
    changeItem(1);
  });

});
</script>
