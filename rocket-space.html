
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROCKET SPACE — 3D animation project by HOZA.">
  <title>ROCKET SPACE — HOZA</title>
    
      .bts-title {
        font-size: 22px;
      }

      .bts-row-2,
      .bts-row-3 {
        grid-template-columns: 1fr;
      }
    }
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .back {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: right;
    }

    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }

    .label {
      display: inline-block;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(48px, 9vw, 110px);
      line-height: 1.06;
      letter-spacing: -4px;
    }

    .film {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 70px;
      background: #000;
    }

    .film video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 16px;
      }

      .logo {
        font-size: 29px;
      }

      .intro {
        padding: 0 16px;
        margin: 35px auto 25px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .film {
        margin-bottom: 50px;
      }
    }
    <style>

  /* Existing website CSS */

  .bts-wrap {
    width: calc(100% - 32px);
    max-width: 1100px;
    margin: 0 auto 80px;
  }

  /* Rest of Behind the Scenes CSS */

</style>
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">&larr; BACK TO ANIMATION</a>
  </header>

  <main>
    <div class="intro">
      <span class="label">02 / ANIMATION PROJECT</span>
      <h1>ROCKET SPACE</h1>
      <span class="label">MAIN FILM</span>
    </div>

    <section class="film" aria-label="Rocket Space main film">
      <video controls playsinline preload="metadata"
             poster="videos/rocket-space-cover.jpg">
        <source src="videos/rocket-space.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </section>
        <section class="bts-wrap">
      <h2 class="bts-title">BEHIND THE SCENES</h2>

      <div class="bts-gallery">

        <!-- Full width image -->
        <img src="images/rocket-space/bts-01.jpg" alt="Rocket Space Behind The Scenes 01" loading="lazy">

        <!-- Two images beside each other -->
        <div class="bts-row-2">
          <img src="images/rocket-space/bts-02.jpg" alt="Rocket Space Behind The Scenes 02" loading="lazy">
          <img src="images/rocket-space/bts-03.jpg" alt="Rocket Space Behind The Scenes 03" loading="lazy">
        </div>

        <!-- Full width video -->
        <video controls playsinline preload="metadata">
          <source src="videos/rocket-space-bts.mp4" type="video/mp4">
        </video>

        <!-- Three images beside each other -->
        <div class="bts-row-3">
          <img src="images/rocket-space/bts-04.jpg" alt="Rocket Space Behind The Scenes 04" loading="lazy">
          <img src="images/rocket-space/bts-05.jpg" alt="Rocket Space Behind The Scenes 05" loading="lazy">
          <img src="images/rocket-space/bts-06.jpg" alt="Rocket Space Behind The Scenes 06" loading="lazy">
        </div>

      </div>
    </section>
  </main>
</body>
</html>
