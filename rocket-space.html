
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROCKET SPACE — 3D animation project by HOZA.">
  <title>ROCKET SPACE — HOZA</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      max-width: 1180px;
      margin: auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .back {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: right;
    }

    .intro {
      max-width: 1180px;
      margin: 50px auto 35px;
      padding: 0 24px;
    }

    .label {
      display: inline-block;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(48px, 9vw, 110px);
      line-height: 1.06;
      letter-spacing: -4px;
    }

    .film {
      width: calc(100% - 32px);
      max-width: 1100px;
      margin: 0 auto 70px;
      background: #000;
    }

    .film video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 16px;
      }

      .logo {
        font-size: 29px;
      }

      .intro {
        padding: 0 16px;
        margin: 35px auto 25px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .film {
        margin-bottom: 50px;
      }
    }
  

  .bts-wrap {
    width: calc(100% - 32px);
    max-width: 1100px;
    margin: 0 auto 80px;
  }
    
.bts-title {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  margin: 0;
}

/* ROCKET SPACE - BTS MAIN VIDEO */
.bts-main-video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #000;
  margin-top: 24px;
  border-radius: 10px;
}

/* ROCKET SPACE - BTS VIDEOS GRID */
.rocket-bts-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  margin-top: 12px;
}

.rocket-bts-grid video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #000;
  border-radius: 10px;
}

/* ROCKET SPACE - BTS THREE COLUMN VIDEOS */
.rocket-bts-triple-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  margin-top: 12px;
}

.rocket-bts-triple-grid video {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: contain;
  background: #000;
  border-radius: 10px;
}
.rocket-stills-wrap {
  width: calc(100% - 32px);
  max-width: 1100px;
  margin: 32px auto 60px;
}

.rocket-stills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.rocket-stills-grid img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 10px;
  background: #111;
}

@media (max-width: 768px) {
  .rocket-stills-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">HOZA.</a>
    <a href="animation.html" class="back">&larr; BACK TO ANIMATION</a>
  </header>

  <main>
    <div class="intro">
      <span class="label">02 / ANIMATION PROJECT</span>
      <h1>ROCKET SPACE</h1>

    </div>

    <section class="film" aria-label="Rocket Space main film">
      <video controls playsinline preload="metadata"
             poster="videos/rocket-space-cover.jpg">
        <source src="videos/rocket-space.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </section>
    
<section class="rocket-stills-wrap">
  <div class="rocket-stills-grid">
    <img src="images/rocket-space/rocket-shot-01.jpg" alt="Rocket Space Still 01" loading="lazy">
    <img src="images/rocket-space/rocket-shot-02.jpg" alt="Rocket Space Still 02" loading="lazy">

       <!-- ROCKET SPACE - BEHIND THE SCENES -->

</section>

  </main>
</body>
</html>
