<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mekky character design, turnaround and environment by HOZA.">
  <title>MEKKY — HOZA</title>
  <style>
    :root { color-scheme: dark; --bg:#09090b; --text:#fff; --muted:#a5a5ab; --line:rgba(255,255,255,.16); }
    * { box-sizing: border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .site-header { max-width:1180px; margin:auto; padding:28px 24px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .logo { font-size:34px; font-weight:900; letter-spacing:-2px; }
    .back { font-size:11px; font-weight:bold; letter-spacing:1px; }
    .intro { width:calc(100% - 32px); max-width:1100px; margin:55px auto 28px; text-align:left; }
    .label { color:var(--muted); font-size:11px; font-weight:bold; letter-spacing:2px; }
    h1 { margin:14px 0 8px; font-size:clamp(52px,9vw,106px); line-height:1; letter-spacing:-4px; }
    .cover { width:calc(100% - 32px); max-width:1100px; margin:0 auto 80px; }
    .cover img { display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:contain; background:#fff; border-radius:6px; }
    .gallery { width:calc(100% - 32px); max-width:1100px; margin:0 auto 110px; text-align:left; }
    .gallery-heading { padding:36px 0 12px; border-top:1px solid var(--line); }
    .gallery-heading h2 { margin:0 0 10px; font-size:clamp(26px,4vw,42px); letter-spacing:-1px; }
    .gallery-heading p { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
    .artwork { margin:40px 0 0; }
    .artwork figcaption { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px 20px; margin:0 0 14px; text-align:left; }
    .artwork-title { font-size:16px; font-weight:700; letter-spacing:-.2px; }
    .artwork-note { font-size:11px; color:var(--muted); line-height:1.6; }
    .artwork a { display:block; background:#1b1b1e; border-radius:6px; overflow:hidden; outline-offset:4px; }
    .artwork a:focus-visible { outline:2px solid #fff; }
    .artwork img { display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:contain; }
    .artwork-hint { color:#85858b; font-size:11px; margin-top:12px; }
    @media (max-width:600px) {
      .site-header { padding:22px 16px; } .logo { font-size:29px; } .back { font-size:10px; }
      .intro { margin-top:30px; } h1 { letter-spacing:-2px; }
      .cover { margin-bottom:60px; } .gallery { margin-bottom:70px; }
      .artwork { margin-top:30px; }
    }
    @media (prefers-reduced-motion:reduce) { html {scroll-behavior:auto;} }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="HOZA home">HOZA.</a>
    <a class="back" href="animation.html#characters">BACK TO CHARACTERS ↗</a>
  </header>
  <main>
    <div class="intro">
      <span class="label">CHARACTER DESIGN</span>
      <h1>MEKKY</h1>
    </div>
    <figure class="cover">
      <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_30JYk1lIz5AcI6xVWLe8KnwSHnv/4d80b61d-9031-46c0-a6c4-8bc7f5a86c89.jpg" alt="MEKKY — original illustrated character cover art" fetchpriority="high">
    </figure>
    <section class="gallery" aria-label="MEKKY character artwork">
      <div class="gallery-heading">
        <h2>CHARACTER DEVELOPMENT</h2>
        <p>Exploring MEKKY's original design, personality and visual development.</p>
      </div>
      <figure class="artwork">
        <figcaption>
          <span class="artwork-title">01 / Character Overview</span>
          <span class="artwork-note">Personality, color palette and character turnaround.</span>
        </figcaption>
        <a href="https://d2ol7oe51mr4n9.cloudfront.net/user_30JYk1lIz5AcI6xVWLe8KnwSHnv/abec0b3d-e50a-4601-a647-8e9b589a4ca8.jpg" target="_blank" rel="noopener noreferrer" aria-label="Open MEKKY Character Overview full size">
          <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_30JYk1lIz5AcI6xVWLe8KnwSHnv/abec0b3d-e50a-4601-a647-8e9b589a4ca8.jpg" alt="MEKKY character overview with notes, colors, front and side and back views" loading="lazy" decoding="async">
        </a>
      </figure>
      <figure class="artwork">
        <figcaption>
          <span class="artwork-title">02 / Character Environment</span>
          <span class="artwork-note">MEKKY with pigeons and the rooftop pigeon loft.</span>
        </figcaption>
        <a href="https://d2ol7oe51mr4n9.cloudfront.net/user_30JYk1lIz5AcI6xVWLe8KnwSHnv/69354eb2-c6df-4134-ab55-a7074b8aa8c0.jpg" target="_blank" rel="noopener noreferrer" aria-label="Open MEKKY Character Environment full size">
          <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_30JYk1lIz5AcI6xVWLe8KnwSHnv/69354eb2-c6df-4134-ab55-a7074b8aa8c0.jpg" alt="MEKKY character with pigeons in front of a wooden rooftop pigeon loft" loading="lazy" decoding="async">
        </a>
      </figure>
      <p class="artwork-hint">Click any artwork to view it at full size.</p>
    </section>
  </main>
</body>
</html>
